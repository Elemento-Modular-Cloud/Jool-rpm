name: Build DKMS RPM

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Obtain git within container for checkout
        run: dnf install -y git

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          set-safe-directory: true

      - name: Mark repository as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Enable CRB and EPEL
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb

      - name: Install build tools
        run: dnf install -y rpm-build rpmdevtools git

      - name: Determine version
        run: |
          eval "$(sed -n '/^#define  *JOOL_VERSION_\(MAJOR\|MINOR\|REV\) / {
                            s/^#define  *//; s/  */=/p;
                          }' src/common/xlat.h)"
          JOOLVER="${JOOL_VERSION_MAJOR}.${JOOL_VERSION_MINOR}.${JOOL_VERSION_REV}"

          if git describe --exact-match --tags HEAD 2>/dev/null; then
            MODULE_VERSION=${JOOLVER}
          else
            GITVER="$(git describe --always | tr - . 2>/dev/null)"
            test -z "$GITVER" && GITVER="$(date +%Y%m%d)"
            MODULE_VERSION=${JOOLVER}.git.${GITVER}
          fi

          echo "MODULE_VERSION=${MODULE_VERSION}" >> $GITHUB_ENV
          echo "JOOL_VERSION=${JOOLVER}" >> $GITHUB_ENV

      - name: Create source tarball
        run: |
          rpmdev-setuptree
          git archive \
            --format=tar.gz \
            --prefix=jool-${MODULE_VERSION}/ \
            HEAD \
            -o ~/rpmbuild/SOURCES/jool-${MODULE_VERSION}.tar.gz

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "module_version ${MODULE_VERSION}" \
            --define "jool_version ${JOOL_VERSION}" \
            packaging/jool-dkms.spec

      - name: Upload RPM
        uses: actions/upload-artifact@v5
        with:
          name: jool-dkms-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.REPO_KEY }}
          fetch-depth: 0

      - name: Determine version
        run: |
          eval "$(sed -n '/^#define  *JOOL_VERSION_\(MAJOR\|MINOR\|REV\) / {
                            s/^#define  *//; s/  */=/p;
                          }' src/common/xlat.h)"
          JOOLVER="${JOOL_VERSION_MAJOR}.${JOOL_VERSION_MINOR}.${JOOL_VERSION_REV}"

          if git describe --exact-match --tags HEAD 2>/dev/null; then
            MODULE_VERSION=${JOOLVER}
          else
            GITVER="$(git describe --always | tr - . 2>/dev/null)"
            test -z "$GITVER" && GITVER="$(date +%Y%m%d)"
            MODULE_VERSION=${JOOLVER}.git.${GITVER}
          fi

          echo "MODULE_VERSION=${MODULE_VERSION}" >> $GITHUB_ENV

      - name: Create GitHub release
        id: create_release
        if: ${{ !contains(steps.create_release.outputs.id, 'already_exists') }}
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.MODULE_VERSION }}
          release_name: jool-dkms @ v${{ env.MODULE_VERSION }}
          draft: false
          prerelease: ${{ ! startsWith(github.ref, 'refs/tags/v') }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            rpm_file=$(find artifacts/ -name "*.rpm" | head -n 1)
            gh release upload "v${MODULE_VERSION}" "$rpm_file" --clobber

      - name: Push packages to remote
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REPO_IP }}
          username: ${{ secrets.REPO_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: artifacts/
          target: /home/${{ secrets.REPO_USERNAME }}/

      - name: Select release type
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "RELEASE_TYPE=release" >> $GITHUB_ENV
          else
            echo "RELEASE_TYPE=nightly" >> $GITHUB_ENV
          fi

      - name: Move RPM and DEB packages to repository
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REPO_IP }}
          username: ${{ secrets.REPO_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.REPO_SUDO_PW }} | sudo -S bash -c 'find /home/${{ secrets.REPO_USERNAME }}/artifacts -type f -name "*.rpm" -exec mv {} /mnt/repository/${{ env.RELEASE_TYPE }}/rhel/ \;'
            rm -rf /home/${{ secrets.REPO_USERNAME }}/artifacts

      - name: Sign Packages
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REPO_IP }}
          username: ${{ secrets.REPO_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.REPO_SUDO_PW }} | sudo -S bash /mnt/repository/${{ env.RELEASE_TYPE }}/repo.sh
